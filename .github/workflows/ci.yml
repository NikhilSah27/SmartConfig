name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt
      - name: vet
        run: make vet
      - name: test
        run: go test -count=1 ./...
      - name: test as root
        run: sudo -E env "PATH=$PATH" go test -count=1 ./...
      - name: race
        run: make race
      - name: static build
        run: |
          make build
          file bin/sc | grep -q 'statically linked'
