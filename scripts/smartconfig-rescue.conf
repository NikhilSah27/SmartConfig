# SmartConfig: a drop-in for rescue.service and emergency.service (M4 plan
# 3.1). Install it by hand (README) as
#   /etc/systemd/system/rescue.service.d/50-smartconfig.conf
#   /etc/systemd/system/emergency.service.d/50-smartconfig.conf
# Before the shell's "Press Enter" it says what changed since the last
# healthy boot and how to undo it: the console form, sc's own rules only,
# fits 80x25. A separate unit's output scrolls away; this one lands right
# above the prompt (the M4 lab). "-": its exit status 2 (a problem found)
# or a failure never keeps the shell from starting.
[Service]
ExecStartPre=-/usr/local/sbin/sc status --console
