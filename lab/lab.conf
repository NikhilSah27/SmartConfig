# lab.conf: pins and budgets of the SmartConfig QEMU rescue lab (make lab-e2e).
# KEY=VALUE lines, read by lab/vm.py (load_conf). Dev only, never shipped.

# The guest: the Ubuntu 24.04 server cloud image of one release. The sha256 is
# the one in that release's SHA256SUMS (checked 2026-10-04). The cache keeps
# it as images/<IMAGE_RELEASE>-<IMAGE_NAME>.
IMAGE_BASE_URL=https://cloud-images.ubuntu.com/releases/noble
IMAGE_RELEASE=release-20260926
IMAGE_NAME=ubuntu-24.04-server-cloudimg-amd64.img
IMAGE_SHA256=6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
# The kernel that image boots. Provisioning checks "Linux version" against it
# (package_upgrade is off, so it never changes).
KERNEL=6.8.0-142-generic

# The reference image (vm.py provision). Bump PROVISION_REV when the recipe
# changes outside the files its hash covers (cloud-init/*.in,
# guest/60-sclab.cfg, the key): the next provision then builds a new one.
PROVISION_REV=1
DISK_SIZE=10G

# The machine: q35 under TCG (never KVM). UEFI is the host's OVMF _4M build;
# BIOS is QEMU's default SeaBIOS.
QEMU=qemu-system-x86_64
OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
SMP=2
MEM=2048
NICE=10

# Wall-clock budgets in seconds (design section 4). Under TCG this host has
# stalled for more than 10 minutes at a time, so they are generous.
BUDGET_KERNEL_LOGIN=900
BUDGET_LOGIN_SSH=600
BUDGET_POLL=300
BUDGET_MENU=600
BUDGET_MENU_KEY=5
BUDGET_KERNEL_RESCUE=900
BUDGET_CMD=180
BUDGET_CMD_SC=300
BUDGET_RESET=600
BUDGET_SHUTDOWN=600
BUDGET_MODE=4500
BUDGET_PROVISION=1800
# Boot 2 (design 2.4 and 2.7): the wait for its end, the ssh probes after it,
# and the pause before the reset.
BUDGET_BOOT2_END=600
BUDGET_BOOT2_SSH=180
SSH_PROBE_EVERY=10
RESET_SETTLE=35

# Retries (design section 6): per mode, panics per boot, and provisioning
# boots after a panic. Old run directories kept by vm.py gc.
RETRIES_MODE=5
RETRIES_PANIC=3
PROVISION_RETRIES=3
KEEP_RUNS=10
