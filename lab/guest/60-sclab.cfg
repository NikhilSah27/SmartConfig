# 60-sclab.cfg: the GRUB settings of the SmartConfig QEMU lab (lab only,
# never shipped). "vm.py provision" bakes it into the reference image as
# /etc/default/grub.d/60-sclab.cfg. It sorts after the cloud image's
# 50-cloudimg-settings.cfg, so these settings win.
#
# no_timer_check: under TCG on a busy host the kernel can panic with
# "IO-APIC + timer doesn't work". GRUB_CMDLINE_LINUX goes on every entry,
# the SmartConfig rescue entry too.
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }no_timer_check"
# No menu and no wait, as on an owner's machine. recordfail's own menu stays
# off too, so after a failed boot only SmartConfig's flag can bring the menu.
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_RECORDFAIL_TIMEOUT=0
